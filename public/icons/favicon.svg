<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4954a"/>
      <stop offset="50%" stop-color="#b06a3b"/>
      <stop offset="100%" stop-color="#8a4f2a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Guitar neck lines -->
  <g stroke="#b06a3b" stroke-opacity="0.15" stroke-width="2">
    <line x1="100" y1="140" x2="412" y2="140"/>
    <line x1="100" y1="190" x2="412" y2="190"/>
    <line x1="100" y1="240" x2="412" y2="240"/>
    <line x1="100" y1="290" x2="412" y2="290"/>
    <line x1="100" y1="340" x2="412" y2="340"/>
    <line x1="100" y1="390" x2="412" y2="390"/>
    <!-- Frets -->
    <line x1="170" y1="130" x2="170" y2="400" stroke-opacity="0.1"/>
    <line x1="240" y1="130" x2="240" y2="400" stroke-opacity="0.1"/>
    <line x1="310" y1="130" x2="310" y2="400" stroke-opacity="0.1"/>
    <line x1="380" y1="130" x2="380" y2="400" stroke-opacity="0.1"/>
  </g>
  <!-- Note dots -->
  <circle cx="205" cy="190" r="22" fill="url(#gold)" opacity="0.9"/>
  <circle cx="275" cy="290" r="22" fill="url(#gold)" opacity="0.9"/>
  <circle cx="345" cy="240" r="22" fill="url(#gold)" opacity="0.7"/>
  <circle cx="135" cy="340" r="22" fill="url(#gold)" opacity="0.5"/>
  <!-- M letter -->
  <text x="256" y="460" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="#b06a3b" text-anchor="middle" opacity="0.6">FRETMAESTRO</text>
  <!-- Main icon symbol -->
  <text x="256" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="160" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="central" opacity="0.95">♪</text>
</svg>
