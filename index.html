<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="FretMaestro — professional guitar trainer: fretboard, chords, scales, CAGED, arpeggios, metronome & music theory." />
    <meta name="keywords" content="guitar, fretboard, chords, scales, CAGED, arpeggio, music theory, гитара, аккорды, гаммы" />

    <!-- Open Graph -->
    <meta property="og:title" content="FretMaestro — Guitar Trainer" />
    <meta property="og:description" content="Professional guitar trainer — chords, scales, CAGED, arpeggios, metronome & music theory" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <title>FretMaestro — Guitar Trainer</title>

    <style>
      body { margin: 0; background: #121212; }
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #121212; z-index: 9999; }
      #splash span { color: #b06a3b; font-size: 1.5rem; font-family: system-ui; font-weight: 700; }
    </style>
  </head>

  <body>
    <div id="splash"><span>FretMaestro</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const s = document.getElementById('splash');
        if (s) setTimeout(() => { s.style.opacity = '0'; s.style.transition = 'opacity .3s'; setTimeout(() => s.remove(), 300); }, 200);
      });
    </script>
  </body>
</html>
